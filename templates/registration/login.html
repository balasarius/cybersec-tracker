{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Cyber Security Tracker</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      {% if form.errors %}<p role="alert">The username or password was not accepted.</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
      </form>
      <p><a href="{% url 'password_reset' %}">Forgotten your password?</a></p>
    </main>
  </body>
</html>
