[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cybersec-tracker"
version = "0.1.0"
description = "Open-source security remediation tracking and collaboration platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "celery[redis]>=5.5,<5.6",
  "django>=5.2,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "config", "connectors", "destination_adapters", "sdk"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["apps", "config", "connectors", "destination_adapters", "sdk"]
omit = ["*/migrations/*", "manage.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "A", "C4", "DTZ", "T20", "PT", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["S105"]
"tests/**/*.py" = ["S106"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings"
